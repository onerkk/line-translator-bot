name: Factory translation release gate

on:
  push:
    paths:
      - "*.py"
      - "requirements.txt"
      - "requirements-test.txt"
      - "static/admin_reminders.*"
      - "factory_*.py"
      - "factory_*.json"
      - "translation_casebook.py"
      - "translation_quality_gate.py"
      - "glossary_*.py"
      - "glossary_*.json"
      - "test_*root_fix.py"
      - "test_translation_quality_gate.py"
      - "validate_factory_translation_assets.py"
      - ".github/workflows/factory-translation-release-gate.yml"
  pull_request:
    paths:
      - "*.py"
      - "requirements.txt"
      - "requirements-test.txt"
      - "static/admin_reminders.*"
      - "factory_*.py"
      - "factory_*.json"
      - "translation_casebook.py"
      - "translation_quality_gate.py"
      - "glossary_*.py"
      - "glossary_*.json"
      - "test_*root_fix.py"
      - "test_translation_quality_gate.py"
      - "validate_factory_translation_assets.py"
      - ".github/workflows/factory-translation-release-gate.yml"
  workflow_dispatch:

jobs:
  deterministic-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate versioned factory assets
        run: python validate_factory_translation_assets.py --json
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run all translation regression tests without API credentials
        env:
          LINE_CHANNEL_SECRET: offline-ci-secret
          LINE_CHANNEL_ACCESS_TOKEN: offline-ci-token
          REQUIRE_CLOUD_SETTINGS: "0"
          REMINDERS_WORKER_ENABLED: "0"
          TM_DB_PATH: ${{ runner.temp }}/translation-memory.db
          VECTOR_TM_DB_PATH: ${{ runner.temp }}/vector-memory.db
          ACTIVE_LEARNING_DB_PATH: ${{ runner.temp }}/active-learning.db
          TRANSLATION_RETRY_DB_PATH: ${{ runner.temp }}/translation-retry.db
          BOT_SETTINGS_CACHE_FILE: ${{ runner.temp }}/bot-settings.json
          CUSTOM_EXAMPLES_FILE: ${{ runner.temp }}/custom-examples.json
          PHASE_CONFIG_PATH: ${{ runner.temp }}/phase-config.json
          LAST_TRANSLATE_DEBUG_FILE: ${{ runner.temp }}/last-translate.json
          TRANSLATION_LOG_FILE: ${{ runner.temp }}/translation-log.json
        run: python -m pytest -q test_*.py
