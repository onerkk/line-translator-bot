  <!-- The original opening can paint before any stylesheet or SDK arrives.
       All complete stylesheets still apply before the application renders. -->
  <style>
    body{margin:0;font:400 1rem/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
    #splash,#splash *{box-sizing:border-box;margin:0;padding:0}
    #splash{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(150deg,#263f65,#10243e);color:#fff;pointer-events:none}
    #splash img{width:74px;height:74px;border-radius:22px;border:1px solid #a6c4ea5c;box-shadow:inset 0 1px 0 #fff8,0 4px 0 #0b1930,0 15px 30px #07152a70}
    #splash h1{font-size:1.625rem;margin-top:21px;letter-spacing:-.025em}
    #splash p{font-size:.8125rem;color:#c3d4e8;margin-top:5px;letter-spacing:.07em}
  </style>
  <script>
    window.myshiftShellStartedAt=performance.now();
    window.myshiftStylesReady=false;
    window.myshiftStyleLoaded=function(link){
      if(link.dataset.ready)return;
      link.dataset.ready='1';link.media='all';
      if(document.querySelectorAll('link[data-shell-style][data-ready="1"]').length===document.querySelectorAll('link[data-shell-style]').length){
        window.myshiftStylesReady=true;
        window.dispatchEvent(new Event('myshift:styles-ready'));
      }
    };
    window.myshiftStyleFailed=function(){
      var p=document.querySelector('#splash p');
      if(p){p.textContent='連線中斷，點此重新載入';p.style.pointerEvents='auto';p.onclick=function(){location.reload()};}
    };
  </script>
